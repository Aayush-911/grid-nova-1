<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIDNOVA — Intelligent Renewable Microgrid Monitoring &amp; Diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#20231E;
  --bg-soft:#292D26;
  --card:#30352D;
  --text:#F2F0E8;
  --text-secondary:#B9BAAF;
  --text-faint:#92958A;
  --border:#45483E;
  --border-soft:#3A3E34;
  --blue:#8C9A62;
  --blue-soft:#3A4130;
  --green:#87A878;
  --green-soft:#354333;
  --yellow:#D6A65D;
  --yellow-soft:#49402B;
  --orange:#C8754E;
  --orange-soft:#4A352B;
  --red:#C66B5C;
  --red-soft:#4A302B;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.12);
  --shadow-md:0 12px 34px rgba(0,0,0,0.24);
  --sidebar-w:236px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#55594B; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== utility ===== */
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-1{gap:4px;}
.grid{display:grid;}
.hidden{display:none !important;}
.w-full{width:100%;}
.relative{position:relative;}

/* ===== SVG icon base ===== */
.icon{width:18px; height:18px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block;}
.icon-sm{width:14px; height:14px;}
.icon-lg{width:26px; height:26px;}

/* ===== Login Screen ===== */
#screen-login{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1200px 600px at 15% 10%, #3A4130 0%, transparent 60%),
    radial-gradient(1000px 500px at 90% 90%, #354333 0%, transparent 55%),
    var(--bg);
  padding:24px;
}
.login-card{
  width:100%; max-width:920px; background:var(--card); border:1px solid var(--border);
  border-radius:20px; box-shadow:var(--shadow-md); overflow:hidden;
  display:grid; grid-template-columns:1.1fr 1fr;
}
.login-visual{
  background:linear-gradient(160deg,#20231E 0%, #30352D 55%, #8C9A62 100%);
  color:#fff; padding:44px 38px; display:flex; flex-direction:column; justify-content:space-between;
  position:relative; overflow:hidden;
}
.login-visual::after{
  content:''; position:absolute; inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
  background-size:22px 22px; opacity:0.5;
}
.flow-diagram{display:flex; align-items:center; gap:10px; position:relative; z-index:1; flex-wrap:wrap;}
.flow-node{
  display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:rgba(255,255,255,0.85);
}
.flow-node .badge-circle{
  width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
}
.flow-arrow{color:rgba(255,255,255,0.5); font-size:16px;}
.login-form-wrap{padding:48px 44px; display:flex; flex-direction:column; justify-content:center;}
.login-logo{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.login-logo .logo-mark{
  width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#8C9A62,#87A878);
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.login-logo span{font-size:19px; font-weight:800; letter-spacing:0.5px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px;}
.field input{
  width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:10px; font-size:14px;
  background:#FBFCFE; color:var(--text); outline:none; transition:border-color .15s;
}
.field input:focus{border-color:var(--blue); background:#fff;}
.btn{
  border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s, box-shadow .15s, background .15s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--blue); color:#fff; box-shadow:0 1px 2px rgba(37,99,235,0.15);}
.btn-primary:hover{background:#8C9A62;}
.btn-secondary{background:#fff; color:var(--text); border:1px solid var(--border);}
.btn-secondary:hover{background:var(--bg-soft);}
.btn-ghost{background:transparent; color:var(--text-secondary); border:1px solid var(--border);}
.btn-block{width:100%;}
.divider-text{display:flex; align-items:center; gap:10px; color:var(--text-faint); font-size:12px; margin:14px 0;}
.divider-text::before,.divider-text::after{content:''; flex:1; height:1px; background:var(--border);}

/* ===== Site Selection ===== */
#screen-sites{min-height:100vh; padding:36px 48px; background:var(--bg);}
.sites-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px; flex-wrap:wrap; gap:16px;}
.sites-grid-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:26px; align-items:start;}
.site-list{display:flex; flex-direction:column; gap:14px;}
.site-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;
  box-shadow:var(--shadow-sm); transition:box-shadow .18s, transform .18s, border-color .18s; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap;
}
.site-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:#D8E1EF;}
.site-eyebrow{font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px;}
.site-name{font-size:17px; font-weight:700;}
.site-region{font-size:13px; color:var(--text-secondary); margin-top:1px;}
.status-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;
}
.status-pill .dot{width:7px; height:7px; border-radius:50%;}
.status-online{background:var(--green-soft); color:#87A878;}
.status-online .dot{background:var(--green);}
.status-warning{background:var(--orange-soft); color:#B4590A;}
.status-warning .dot{background:var(--orange);}
.status-critical{background:var(--red-soft); color:#B91C1C;}
.status-critical .dot{background:var(--red);}
.status-info{background:var(--blue-soft); color:#8C9A62;}
.status-info .dot{background:var(--blue);}
.site-metrics{display:flex; gap:26px; flex-wrap:wrap;}
.site-metric{display:flex; flex-direction:column; gap:2px;}
.site-metric .m-label{font-size:11px; color:var(--text-faint); display:flex; align-items:center; gap:4px;}
.site-metric .m-value{font-size:15px; font-weight:700;}
.map-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow-sm); position:sticky; top:24px;
}
.india-map-svg{width:100%; height:auto; display:block;}
.map-pin-label{font-size:10px; font-weight:700; fill:var(--text);}

/* ===== App Shell ===== */
#screen-app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--card); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; transition:width .18s, padding .18s;
}
.sidebar.collapsed{width:72px; padding:18px 10px;}
.sidebar.collapsed .side-label, .sidebar.collapsed .brand-text, .sidebar.collapsed .op-text{display:none;}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px 8px;}
.brand .logo-mark{
  width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#8C9A62,#87A878);
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column;}
.brand-text b{font-size:15.5px; font-weight:800; letter-spacing:0.3px;}
.brand-text small{font-size:10px; color:var(--text-faint); font-weight:600; letter-spacing:0.03em;}
.nav-group{display:flex; flex-direction:column; gap:2px; flex:1; margin-top:4px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; color:var(--text-secondary);
  font-size:13.5px; font-weight:500; transition:background .13s, color .13s;
}
.nav-item .icon{color:var(--text-faint); transition:color .13s;}
.nav-item:hover{background:var(--bg-soft); color:var(--text);}
.nav-item.active{background:var(--blue-soft); color:var(--blue);}
.nav-item.active .icon{color:var(--blue);}
.sidebar-foot{border-top:1px solid var(--border-soft); padding-top:12px; margin-top:8px; display:flex; flex-direction:column; gap:2px;}
.op-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;}
.op-avatar{width:30px; height:30px; border-radius:50%; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; color:var(--text-secondary); flex-shrink:0;}
.op-text{display:flex; flex-direction:column;}
.op-text b{font-size:12.5px; font-weight:600;}
.op-text small{font-size:10.5px; color:var(--text-faint);}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:62px; border-bottom:1px solid var(--border); background:rgba(247,249,252,0.85); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:20;
}
.crumb{font-size:13px; color:var(--text-faint); display:flex; align-items:center; gap:6px;}
.crumb b{color:var(--text); font-weight:700;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--border-soft);
  border-radius:9px; padding:7px 11px; width:190px; color:var(--text-faint);
}
.search-box input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--text);}
.icon-btn{
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border); background:#fff; color:var(--text-secondary); position:relative; transition:background .13s;
}
.icon-btn:hover{background:var(--bg-soft);}
.notif-dot{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid #fff;}
.pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.45;}}
.site-select-btn{
  display:flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid var(--border); border-radius:9px; background:#fff; font-size:13px; font-weight:600;
}
.status-chip{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:#87A878;}
.status-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--green-soft);}

.page{padding:24px 28px 60px 28px; max-width:1480px;}
.page-head{margin-bottom:20px;}
.page-head h1{font-size:21px; font-weight:800; letter-spacing:-0.2px;}
.page-head p{font-size:13.5px; color:var(--text-secondary); margin-top:3px;}
.page-head-row{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:20px;}

/* cards & grids */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.card-title-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.card-title{font-size:14px; font-weight:700;}
.card-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}

.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
.kpi-card{padding:17px 18px; display:flex; flex-direction:column; gap:8px; transition:box-shadow .15s, transform .15s;}
.kpi-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.kpi-top{display:flex; justify-content:space-between; align-items:center;}
.kpi-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.kpi-label{font-size:12px; font-weight:600; color:var(--text-secondary);}
.kpi-value{font-size:24px; font-weight:800; letter-spacing:-0.3px;}
.kpi-foot{font-size:12px; display:flex; align-items:center; gap:5px;}
.up{color:var(--green);} .down{color:var(--red);}

.two-col{display:grid; grid-template-columns:1.35fr 1fr; gap:16px; margin-bottom:16px;}
.three-col{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}

.tab-row{display:flex; gap:4px; background:var(--bg-soft); padding:4px; border-radius:10px; width:fit-content;}
.tab-btn{padding:7px 14px; font-size:12.5px; font-weight:600; border-radius:7px; color:var(--text-secondary); border:none; background:transparent;}
.tab-btn.active{background:#fff; color:var(--text); box-shadow:var(--shadow-sm);}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;}
.badge-green{background:var(--green-soft); color:#87A878;}
.badge-yellow{background:var(--yellow-soft); color:#946200;}
.badge-orange{background:var(--orange-soft); color:#B4590A;}
.badge-red{background:var(--red-soft); color:#B91C1C;}
.badge-blue{background:var(--blue-soft); color:#8C9A62;}
.badge-gray{background:var(--bg-soft); color:var(--text-secondary);}

/* energy flow */
.flow-row{display:flex; align-items:center; justify-content:space-between; padding:22px 10px; flex-wrap:wrap; gap:18px;}
.flow-col{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:90px;}
.flow-icon-circle{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;
  box-shadow:0 0 0 6px var(--flow-ring, var(--blue-soft));
}
.flow-col b{font-size:14px; font-weight:800;}
.flow-col span{font-size:11px; color:var(--text-faint);}
.flow-link{flex:1; height:6px; border-radius:6px; position:relative; overflow:hidden; min-width:44px; margin:0 2px;}
.flow-link-track{position:absolute; inset:0; opacity:0.18;}
.flow-dot{position:absolute; top:50%; width:7px; height:7px; border-radius:50%; transform:translateY(-50%); animation:flowmove 2.6s linear infinite;}
@keyframes flowmove{0%{left:-4%;}100%{left:104%;}}

/* nodes */
.topology-wrap{display:flex; flex-direction:column; align-items:center; gap:0; padding:10px 0;}
.topology-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.topo-connector{width:1.5px; height:22px; background:var(--border); margin:0 auto;}
.node-card{
  width:150px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 13px; cursor:pointer;
  transition:box-shadow .15s, transform .15s, border-color .15s;
}
.node-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.node-card.attention{border-color:#F3CB86; background:#FFFCF6;}
.node-card.critical{border-color:#F0AFAF; background:#FFF9F9;}
.node-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.node-name{font-size:13px; font-weight:700;}
.node-stat-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-secondary); padding:1.5px 0;}
.node-stat-row b{color:var(--text); font-weight:600;}
.health-bar-track{height:5px; border-radius:6px; background:var(--bg-soft); margin-top:8px; overflow:hidden;}
.health-bar-fill{height:100%; border-radius:6px;}

.hub-card{width:170px; text-align:center; padding:12px 10px; background:#fff; border:1px solid var(--border); border-radius:12px;}
.hub-card b{font-size:12.5px;}

/* fault localization */
.fault-panel{border-radius:var(--radius); padding:20px 22px; border:1px solid var(--border);}
.fault-panel.ok{background:var(--green-soft); border-color:#CFEEDA;}
.fault-panel.warn{background:#FFFBF1; border-color:#F3E3B3;}
.fault-loc{font-size:15px; font-weight:800; margin:8px 0 4px 0;}
.confidence-bar{height:8px; background:#fff; border-radius:6px; overflow:hidden; margin-top:6px; border:1px solid var(--border-soft);}
.confidence-fill{height:100%; border-radius:6px; background:var(--orange);}

/* loss analysis */
.loss-flow-bar{display:flex; height:34px; border-radius:8px; overflow:hidden; margin-top:6px;}
.loss-flow-seg{height:100%; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; min-width:2px;}
.loss-legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;}
.loss-legend-item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-secondary);}
.legend-dot{width:9px; height:9px; border-radius:3px;}

/* AI insights */
.insight-card{padding:18px 20px; display:flex; gap:14px; align-items:flex-start;}
.insight-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.insight-title{font-size:14px; font-weight:700; margin-bottom:3px;}
.insight-body{font-size:13px; color:var(--text-secondary); line-height:1.5;}
.insight-meta{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
.insight-meta-item{font-size:11.5px; color:var(--text-faint);}
.insight-meta-item b{color:var(--text); font-weight:700;}
.why-box{margin-top:12px; background:var(--bg-soft); border-radius:10px; padding:11px 13px;}
.why-box summary{font-size:12px; font-weight:700; color:var(--blue); cursor:pointer; list-style:none;}
.why-box summary::-webkit-details-marker{display:none;}
.why-list{margin-top:8px; display:flex; flex-direction:column; gap:5px;}
.why-list li{font-size:12px; color:var(--text-secondary); list-style:none; display:flex; gap:6px;}
.why-list li::before{content:'—'; color:var(--text-faint);}

/* alerts table */
.alerts-table{width:100%; border-collapse:collapse;}
.alerts-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); padding:0 14px 10px 14px; font-weight:700;}
.alerts-table td{padding:13px 14px; border-top:1px solid var(--border-soft); font-size:13px;}
.alerts-table tr{cursor:pointer; transition:background .12s;}
.alerts-table tbody tr:hover{background:var(--bg-soft);}
.alert-msg{font-weight:600;}

/* settings */
.settings-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-top:1px solid var(--border-soft);}
.settings-row:first-child{border-top:none;}
.settings-row-label{font-size:13.5px; font-weight:600;}
.settings-row-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
.toggle{width:38px; height:22px; border-radius:99px; background:var(--border); position:relative; transition:background .15s; flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:3px; left:3px; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.toggle.on::after{left:19px;}

/* chart wrap */
.chart-wrap{position:relative; height:230px;}
.chart-wrap-sm{position:relative; height:170px;}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,25,45,0.42); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:24px; animation:fadein .15s ease;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:#fff; border-radius:16px; width:100%; max-width:460px; box-shadow:0 20px 60px rgba(15,25,45,0.25);
  max-height:88vh; overflow-y:auto; animation:slideup .18s ease;
}
@keyframes slideup{from{transform:translateY(12px); opacity:0;}to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:15.5px; font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border-soft);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
.stat-box{background:var(--bg-soft); border-radius:10px; padding:11px 13px;}
.stat-box .l{font-size:11px; color:var(--text-faint); margin-bottom:3px;}
.stat-box .v{font-size:15px; font-weight:800;}

/* toast */
#toast-wrap{position:fixed; top:76px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:#fff; border:1px solid var(--border); box-shadow:var(--shadow-md); border-radius:12px; padding:12px 16px;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; min-width:260px;
  animation:toastin .2s ease;
}
@keyframes toastin{from{transform:translateX(30px); opacity:0;}to{transform:translateX(0); opacity:1;}}

/* solar array table */
.data-table{width:100%; border-collapse:collapse;}
.data-table th{text-align:left; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; padding:0 12px 10px 12px; font-weight:700;}
.data-table td{padding:12px; border-top:1px solid var(--border-soft); font-size:13px;}
.data-table td.num{text-align:right; font-weight:600;}
.data-table th.num{text-align:right;}

.empty-state{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty-state .icon-lg{margin:0 auto 12px auto; color:var(--text-faint);}
.empty-state b{color:var(--text-secondary); display:block; margin-bottom:4px; font-size:14px;}

/* =======================================================================
   RESPONSIVE — TABLET & PHONE
   Breakpoints:
     ≤1100px  large tablet / small laptop
     ≤900px   tablet portrait
     ≤720px   large phone / small tablet portrait
     ≤600px   phone
     ≤420px   small phone
   ======================================================================= */

/* ---- Large tablet / small laptop (≤1100px) ---- */
@media (max-width: 1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .two-col, .three-col{grid-template-columns:1fr;}
  .sites-grid-wrap{grid-template-columns:1fr;}
  .login-card{grid-template-columns:1fr;}
  .login-visual{display:none;}
  .map-card{position:static;}
  :root{--sidebar-w:210px;}
  .page{padding:22px 22px 50px 22px;}
}

/* ---- Tablet portrait (≤900px) ---- */
@media (max-width: 900px){
  :root{--sidebar-w:190px;}
  .sidebar{padding:16px 10px;}
  .nav-item{font-size:13px; padding:9px 8px;}
  .topbar{padding:0 16px;}
  .search-box{width:150px;}
  .page{padding:20px 18px 44px 18px;}
  .kpi-card{padding:15px 16px;}
  .kpi-value{font-size:21px;}
  .node-card{width:132px;}
  .modal-box{max-width:420px;}
  .stat-grid{gap:10px;}
  #screen-sites{padding:28px 24px;}
  .login-card{max-width:520px;}
  .login-form-wrap{padding:38px 32px;}
}

/* ---- Large phone / small tablet portrait (≤720px) ---- */
@media (max-width: 720px){
  .sidebar{position:fixed; z-index:50; left:-260px; top:0; height:100vh; width:236px; padding:18px 14px;}
  .sidebar.collapsed{width:236px; padding:18px 14px;}
  .sidebar.collapsed .side-label, .sidebar.collapsed .brand-text, .sidebar.collapsed .op-text{display:flex;}
  .sidebar.collapsed .brand-text{display:flex;}
  .sidebar.mobile-open{left:0; box-shadow:0 0 0 2000px rgba(15,25,45,0.35);}
  .main-col{width:100%;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .search-box{display:none;}
  #screen-sites{padding:24px 16px;}
  .sites-top{flex-direction:column; align-items:stretch;}
  .site-card{flex-direction:column; align-items:stretch; gap:14px;}
  .site-card .btn{width:100%;}
  .site-metrics{gap:16px; justify-content:space-between;}
  .topbar{padding:0 14px; height:56px;}
  .crumb{font-size:12px;}
  .crumb b{max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block;}
  .site-select-btn span{display:none;}
  .site-select-btn{padding:7px 9px;}
  .page{padding:16px 14px 40px 14px;}
  .page-head h1{font-size:18px;}
  .page-head-row{align-items:stretch;}
  .page-head-row .flex.gap-2{flex-wrap:wrap;}
  .two-col, .three-col{grid-template-columns:1fr;}
  .flow-row{padding:18px 4px; justify-content:center;}
  .flow-link{min-width:28px;}
  .topology-row{gap:10px;}
  .node-card{width:calc(50% - 6px); min-width:130px;}
  .chart-wrap{height:200px;}
  .chart-wrap-sm{height:150px;}
  .modal-box{max-width:94vw;}
  .modal-foot{flex-wrap:wrap;}
  .modal-foot .btn{flex:1 1 100%;}
  .alerts-table, .data-table{display:block; overflow-x:auto; white-space:nowrap;}
  .login-form-wrap{padding:32px 26px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}

/* ---- Phone (≤600px) ---- */
@media (max-width: 600px){
  .kpi-grid{grid-template-columns:1fr;}
  .topbar-right{gap:6px;}
  .icon-btn{width:32px; height:32px;}
  .status-chip span:not(.dot){display:none;}
  .status-chip{gap:4px;}
  .card-pad{padding:15px 14px;}
  .card-title-row{flex-wrap:wrap; gap:8px;}
  .tab-row{overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch;}
  .tab-btn{white-space:nowrap;}
  .node-card{width:100%;}
  .topology-row{flex-direction:column; align-items:stretch;}
  .fault-panel{padding:16px 16px;}
  .insight-card{flex-direction:column; padding:16px;}
  .insight-icon{margin-bottom:4px;}
  .flow-row{flex-direction:column; gap:14px;}
  .flow-link{width:2px; height:26px; min-width:0;}
  .flow-dot{top:0; left:50% !important; transform:translateX(-50%); animation:flowmovev 2.6s linear infinite;}
  @keyframes flowmovev{0%{top:-4%;}100%{top:104%;}}
  .site-metrics{gap:12px;}
  .site-metric{min-width:44%;}
  .login-card{border-radius:14px;}
  .field input{font-size:16px;} /* avoid iOS zoom on focus */
  #toast-wrap{left:16px; right:16px; top:66px;}
  .toast{min-width:0; width:100%;}
  .modal-head, .modal-body{padding:16px;}
  .stat-grid{grid-template-columns:1fr;}
}

/* ---- Small phone (≤420px) ---- */
@media (max-width: 420px){
  .page{padding:14px 10px 36px 10px;}
  .page-head h1{font-size:17px;}
  .kpi-value{font-size:19px;}
  .brand-text b{font-size:14px;}
  .login-logo span{font-size:16px;}
  .login-form-wrap{padding:24px 18px;}
  .btn{padding:10px 14px; font-size:13px;}
  .site-name{font-size:15.5px;}
  .site-metric .m-value{font-size:13.5px;}
  .crumb b{max-width:70px;}
  .chart-wrap{height:180px;}
  .chart-wrap-sm{height:140px;}
}

/* Prototype / Firebase source selector */
.data-source-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:16px 0;padding:13px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
.data-source-title{font-size:13px;font-weight:800}.data-source-sub{font-size:11.5px;color:var(--text-secondary);margin-top:3px}
.source-actions{display:flex;gap:7px;flex-wrap:wrap}.source-btn{border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--bg);color:var(--text-secondary);font-size:12px;font-weight:700}.source-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.source-status{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.source-status .dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}.source-status.connected .dot{background:var(--green)}
.firebase-help{font-size:12px;line-height:1.6;color:var(--text-secondary);margin-top:10px}.firebase-config-input{width:100%;min-height:105px;border:1px solid var(--border);border-radius:9px;padding:10px;font:12px 'IBM Plex Mono',monospace;background:var(--bg);color:var(--text);resize:vertical}.firebase-url-input{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;font:12px 'IBM Plex Mono',monospace;background:var(--bg);color:var(--text)}
@media(max-width:720px){.data-source-bar{align-items:flex-start}.source-actions{width:100%}.source-btn{flex:1}}

/* ===== GRIDNOVA EXHIBITION DESIGN SYSTEM ===== */
:root{
 --bg:#20231E;--bg-soft:#292D26;--card:#30352D;--text:#F2F0E8;--text-secondary:#B9BAAF;--text-faint:#92958A;
 --border:#45483E;--border-soft:#3A3E34;--blue:#8C9A62;--blue-soft:#3A4130;--green:#87A878;--green-soft:#354333;
 --yellow:#D6A65D;--yellow-soft:#49402B;--orange:#C8754E;--orange-soft:#4A352B;--red:#C66B5C;--red-soft:#4A302B;
 --radius:16px;--radius-sm:10px;--shadow-sm:0 2px 8px rgba(0,0,0,.14);--shadow-md:0 12px 34px rgba(0,0,0,.24);--sidebar-w:248px;
}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
button,a,input,textarea{outline-color:#B3BE8B}
::selection{background:#8C9A62;color:#20231E}
::-webkit-scrollbar-thumb{background:#55594B}

.card-title,.page-head h1,.page h1,.page h2,.page h3,.settings-row-label,.node-name{color:var(--text)}
.card-sub,.page-head p,.settings-row-sub,.muted,.field label{color:var(--text-secondary)}
.btn{border-radius:10px;transition:transform .18s ease,background .18s ease,border-color .18s ease}

.icon-btn,.site-select-btn{background:#30352D;color:#F2F0E8;border-color:#45483E}

.kpi-value,.stat-value,.metric-value{color:#F2F0E8}

hr,.divider,.divider-text:before,.divider-text:after{border-color:#45483E}

  };
}
function finiteOr(value, fallback){ const n=Number(value); return value!==null && value!=='' && Number.isFinite(n) ? n : fallback; }
function liveNodes(){
  const baseNodes = NODES_BASE.map(n=>{
    if(STATE.anomaly && n.id==='S03' && STATE.dataMode==='prototype'){ return {...n, ...NODE_ANOMALY_OVERRIDE}; }
    return {...n};
  });
  if(STATE.dataMode!=='firebase' || !Array.isArray(STATE.firebaseNodes)) return baseNodes;
  return baseNodes.map(n=>{
    const incoming=STATE.firebaseNodes.find(x=>String(x.id||x.nodeId||'').toUpperCase()===n.id);
    if(!incoming) return n;
    return {...n,
      power:finiteOr(incoming.powerKw ?? incoming.power, n.power),
      expected:finiteOr(incoming.expectedKw ?? incoming.expected, n.expected),
      voltage:finiteOr(incoming.voltageV ?? incoming.voltage, n.voltage),
      current:finiteOr(incoming.currentA ?? incoming.current, n.current),
      temp:finiteOr(incoming.temperatureC ?? incoming.temp, n.temp),
      health:finiteOr(incoming.healthPct ?? incoming.health, n.health),
      status:incoming.status || n.status
    };
  });
}
function activeAlerts(){
  let list = STATE.anomaly ? [ANOMALY_ALERT, ...ALERTS] : [...ALERTS];
  return list.filter(a=>!STATE.ackedAlerts.has(a.id));
}
function alertById(id){
  if(id==='a0') return ANOMALY_ALERT;
  return ALERTS.find(a=>a.id===id);
}
function statusClass(sev){ return sev==='critical'?'badge-red':sev==='warning'?'badge-orange':sev==='info'?'badge-blue':'badge-green'; }
function pillClass(status){ return status==='online'?'status-online':status==='warning'?'status-warning':status==='critical'?'status-critical':'status-info'; }

function toast(msg, icon){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `${ic(icon||'check','icon-sm')}<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------- LOSS ANALYSIS ---------- */
function renderLoss(){
  const site = currentSite();
  const anomaly = STATE.anomaly;
  const gen = 256.4, stored = 72.8, consumed = 164.2, gridEx = 31.6;
  const baseLoss = 18.7, anomalyLoss = 26.4;
  const loss = anomaly ? anomalyLoss : baseLoss;
  const lossRate = ((loss/gen)*100).toFixed(1);
  const recoverable = anomaly ? 7.9 : 4.8;
  const cats = anomaly
    ? [{l:'Conversion', v:5.1, c:'#8C9A62'},{l:'Battery', v:3.6, c:'#87A878'},{l:'Distribution', v:3.2, c:'#D6A65D'},{l:'Standby', v:2.4, c:'#C8754E'},{l:'Unaccounted (Node S03)', v:12.1, c:'#C66B5C'}]

function connectFirebase(){
  const configText=document.getElementById('firebase-config')?.value?.trim();
  const databaseURL=document.getElementById('firebase-database-url')?.value?.trim();
  const path=(document.getElementById('firebase-database-path')?.value||'gridnova/latest').trim().replace(/^\/+|\/+$/g,'') || 'gridnova/latest';

    const config= configText ? JSON.parse(configText) : {
      apiKey:'AIzaSyBIXm4IpjtR-LVeEaJw5J3mSTSR_IC9hzU',
      authDomain:'gridnova-1eea9.firebaseapp.com',
      databaseURL:'https://gridnova-1eea9-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId:'gridnova-1eea9',
      storageBucket:'gridnova-1eea9.firebasestorage.app',
      messagingSenderId:'650136473628',
      appId:'1:650136473628:web:1b610a57e15200441b0fd9',
      measurementId:'G-2PJERMGL52'
    };
    if(databaseURL) config.databaseURL=databaseURL;
    if(!config.databaseURL) throw new Error('Realtime Database URL is missing.');
    if(!window.firebase || !firebase.database) throw new Error('Firebase SDK could not load. Check internet/CDN access.');
    if(STATE.firebaseRef && STATE.firebaseRef.off) STATE.firebaseRef.off();

    const appName='gridnova-'+Date.now();
    STATE.firebaseApp=firebase.initializeApp(config,appName);
    STATE.firebaseDb=STATE.firebaseApp.database();
    STATE.firebaseRef=STATE.firebaseDb.ref(path);
    STATE.firebaseError='';
    STATE.firebaseRef.on('value', snapshot=>{
      const value=snapshot.val();
      if(!value || typeof value!=='object'){
        STATE.firebaseConnected=false; STATE.firebaseError='No data found at path "'+path+'". Check the ESP32 write path and database rules.';
      } else {
        STATE.firebaseData=value;
        STATE.firebaseNodes=Array.isArray(value.nodes)?value.nodes:(value.nodes && typeof value.nodes==='object'?Object.entries(value.nodes).map(([id,v])=>({id,...v})):null);
        STATE.firebaseLastUpdate=Date.now();
        STATE.firebaseConnected=true; STATE.firebaseError='';
      }
      render();
    }, error=>{
      STATE.firebaseConnected=false; STATE.firebaseError=error?.message || 'Firebase read failed. Check database URL, rules and network.'; render();
    });
    toast('Firebase listener started','check');
  }catch(error){ STATE.firebaseConnected=false; STATE.firebaseError=error.message || String(error); render(); }
}
function disconnectFirebase(){
  if(STATE.firebaseRef){try{STATE.firebaseRef.off();}catch(_){}}
  if(STATE.firebaseApp){try{STATE.firebaseApp.delete();}catch(_){}}
  STATE.firebaseRef=null; STATE.firebaseDb=null; STATE.firebaseApp=null; STATE.firebaseConnected=false;
  STATE.firebaseError=''; STATE.firebaseData=null; STATE.firebaseNodes=null; STATE.firebaseLastUpdate=null;
  if(STATE.dataMode==='firebase') STATE.dataMode='prototype';
  render(); toast('Firebase disconnected','info');
}

/* ============================= LIVE MODE ============================= */
function tickLive(){
  if(STATE.dataMode==='firebase') return;
  STATE.tick++;
  const site = currentSite();
  site.solar = +(site.solar + (Math.random()-0.5)*0.6).toFixed(1);
  site.solar = Math.max(30, Math.min(50, site.solar));
  site.load = +(site.load + (Math.random()-0.5)*0.4).toFixed(1);
  site.load = Math.max(24, Math.min(38, site.load));
  site.battery = Math.max(10, Math.min(99, site.battery + (Math.random()>0.5?0.2:-0.1)));
  site.battery = Math.round(site.battery*10)/10;
  if(STATE.screen==='app' && (STATE.page==='dashboard')){
    render();
  }
}

/* ============================= EVENTS ============================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  switch(action){
    case 'open-dashboard':
      STATE.screen='sites'; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'enter-demo':
      STATE.screen='sites'; render(); break;
    case 'select-site':
      STATE.siteId = el.getAttribute('data-site');
      if(STATE.screen==='sites'){ STATE.screen='app'; STATE.page='dashboard'; }
      render(); break;
    case 'back-to-sites':
      STATE.screen='sites'; render(); break;
    case 'logout':
      if(STATE.liveTimer){ clearInterval(STATE.liveTimer); STATE.liveTimer=null; STATE.live=false; }
      STATE.screen='login'; STATE.anomaly=false; STATE.ackedAlerts=new Set(); render(); break;
    case 'nav':
      STATE.page = el.getAttribute('data-page'); STATE.modal=null;
      if(window.innerWidth<=720){ STATE.sidebarMobileOpen=false; }
      render();
      if(window.innerWidth<=720){ const sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('mobile-open'); }
      break;
    case 'toggle-sidebar':
      if(window.innerWidth<=720){
        const sb = document.getElementById('sidebar');
        if(sb) sb.classList.toggle('mobile-open');
      } else {
        STATE.sidebarCollapsed = !STATE.sidebarCollapsed; render();
      }
      break;
    case 'set-data-mode': {
      const requested=el.getAttribute('data-mode');
      if(requested==='firebase' && !STATE.firebaseConnected){
        STATE.dataMode='firebase'; render(); toast('Configure Firebase in Settings first','info');
      } else { STATE.dataMode=requested; render(); toast(requested==='firebase'?'Live Firebase data selected':'Prototype data selected','check'); }
      break;
    }
    case 'firebase-connect':
      connectFirebase(); break;
    case 'firebase-disconnect':
      disconnectFirebase(); break;
    case 'toggle-live':
      STATE.live = !STATE.live;
      if(STATE.live){ STATE.liveTimer = setInterval(tickLive, 4000); toast('Live simulated updates enabled','check'); }
      else { clearInterval(STATE.liveTimer); STATE.liveTimer=null; toast('Live updates paused','info'); }
      render(); break;
    case 'simulate-anomaly':
      STATE.anomaly = true;
      render();
      toast('Anomaly simulated — Node S03 output dropping','alerttri');
      break;
    case 'reset-simulation':
      STATE.anomaly = false;
      STATE.ackedAlerts.delete('a0');
      render();
      toast('Simulation reset to normal operation','check');
      break;
    case 'open-node':
      STATE.modal = {type:'node', id: el.getAttribute('data-node')}; render(); break;
    case 'open-alert':
      STATE.modal = {type:'alert', id: el.getAttribute('data-alert')}; render(); break;
    case 'close-modal':
      STATE.modal = null; render(); break;
    case 'close-modal-goto':
      STATE.modal = null; STATE.page = el.getAttribute('data-page'); render(); break;
    case 'ack-alert': {
      const id = el.getAttribute('data-alert');
      STATE.ackedAlerts.add(id);
      toast('Alert acknowledged','check');
      render();
      break;
    }
    case 'tab': {
      const group = el.getAttribute('data-tabgroup');
      const tab = el.getAttribute('data-tab');
      if(group==='analytics') STATE.analyticsTab = tab;
      if(group==='alerts') STATE.alertsTab = tab;
      render(); break;
    }
    case 'range':
      STATE.chartRange.gen = el.getAttribute('data-range');
      render(); break;
  }
});

/* ============================= INIT ============================= */
render();
/* Try the configured public web client connection once at startup. If rules or network block it,
   the UI reports the error; prototype mode remains explicitly labeled. */
window.addEventListener('load',()=>{
  try { connectFirebase(); } catch(e) { STATE.firebaseConnected=false; STATE.firebaseError=e.message||String(e); }
});
</script>
</body>
</html>
